name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify tag matches Android versionName
        run: |
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("androidApp/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1))
          PY
          )"
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version (expected $expected)." >&2
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Package artifacts
        id: pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          apk="$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$apk"
          cp "$apk" "dist/dsh-mobile-${version}.apk"
          (cd dist && sha256sum "dsh-mobile-${version}.apk" > SHA256SUMS)
          echo "apk=dist/dsh-mobile-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.pack.outputs.apk }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Android 试用包。允许未知来源后安装 \`dsh-mobile-${GITHUB_REF_NAME#v}.apk\`。

          iOS 目前需要用 Xcode 打开 \`iosApp/iosApp.xcworkspace\` 装到真机，GitHub 无法分发可直接安装的 IPA。

          手机和电脑需在同一可互通网段。公司网若隔离终端，扫码连不上 Relay。
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading APK if missing."
            gh release upload "$GITHUB_REF_NAME" "$APK" dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" dist/SHA256SUMS \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag
          fi
